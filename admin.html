<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hotel Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    h2 {
      margin-top: 35px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    .row {
      margin: 8px 0;
    }

    .label {
      font-weight: bold;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #d68b00;
    }

    .confirmed {
      color: #16833b;
    }

    .rejected {
      color: #c62828;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin: 8px 5px 0 0;
    }

    .confirm {
      background: #2e9d50;
      color: white;
    }

    .reject {
      background: #d33;
      color: white;
    }

    a {
      display: inline-block;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

  </style>

</head>


<body>

  <h1>🏨 Hotel Admin</h1>


  <!-- RESERVATIONS -->

  <h2>📋 Reservations</h2>

  <div id="reservations">
    Loading reservations...
  </div>


  <!-- PAYMENTS -->

  <h2>💳 Payments</h2>

  <div id="payments">
    Loading payments...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // LOAD RESERVATIONS
    // =========================

    async function loadReservations() {

      const container =
        document.getElementById(
          "reservations"
        );


      const { data, error } =
        await supabaseClient
          .from("reservations")
          .select(`
            *,
            customers (
              name,
              phone
            ),
            rooms (
              name,
              room_number
            )
          `)
          .order(
            "created_at",
            { ascending: false }
          );


      if (error) {

        console.error(error);

        container.innerHTML =
          "❌ Could not load reservations.";

        return;

      }


      if (!data.length) {

        container.innerHTML =
          '<div class="empty">No reservations yet.</div>';

        return;

      }


      container.innerHTML = "";


      data.forEach(reservation => {

        container.innerHTML += `

          <div class="card">

            <h3>
              ${reservation.reservation_code}
            </h3>

            <div class="row">
              <span class="label">
                Customer:
              </span>

              ${reservation.customers.name}
            </div>

            <div class="row">
              <span class="label">
                Phone:
              </span>

              ${reservation.customers.phone}
            </div>

            <div class="row">
              <span class="label">
                Room:
              </span>

              ${reservation.rooms.name}
              (${reservation.rooms.room_number})
            </div>

            <div class="row">
              <span class="label">
                Check-in:
              </span>

              ${reservation.check_in}
            </div>

            <div class="row">
              <span class="label">
                Check-out:
              </span>

              ${reservation.check_out}
            </div>

            <div class="row">
              <span class="label">
                Total:
              </span>

              ${Number(
                reservation.total_amount
              ).toFixed(2)} ETB
            </div>

            <div class="row">

              <span class="label">
                Status:
              </span>

              <span class="status ${reservation.status}">
                ${reservation.status}
              </span>

            </div>

          </div>

        `;

      });

    }


    // =========================
    // LOAD PAYMENTS
    // =========================

    async function loadPayments() {

      const container =
        document.getElementById(
          "payments"
        );


      const { data, error } =
        await supabaseClient
          .from("payments")
          .select(`
            *,
            reservations (
              id,
              reservation_code
            )
          `)
          .order(
            "created_at",
            { ascending: false }
          );


      if (error) {

        console.error(error);

        container.innerHTML =
          "❌ Could not load payments.";

        return;

      }


      if (!data.length) {

        container.innerHTML =
          '<div class="empty">No payments yet.</div>';

        return;

      }


      container.innerHTML = "";


      data.forEach(payment => {

        container.innerHTML += `

          <div class="card">

            <h3>
              ${payment.reservations.reservation_code}
            </h3>

            <div class="row">

              <span class="label">
                Amount:
              </span>

              ${Number(
                payment.amount
              ).toFixed(2)} ETB

            </div>


            <div class="row">

              <span class="label">
                Status:
              </span>

              <span class="status ${payment.status}">
                ${payment.status}
              </span>

            </div>


            <a
              href="${payment.receipt_url}"
              target="_blank"
              rel="noopener"
            >
              🔗 Open Receipt
            </a>

            <br>


            ${
              payment.status === "pending"

              ? `

                <button
                  class="confirm"
                  onclick="updatePayment(
                    ${payment.id},
                    ${payment.reservations.id},
                    'confirmed'
                  )"
                >
                  ✅ Confirm
                </button>


                <button
                  class="reject"
                  onclick="updatePayment(
                    ${payment.id},
                    ${payment.reservations.id},
                    'rejected'
                  )"
                >
                  ❌ Reject
                </button>

              `

              : ""

            }

          </div>

        `;

      });

    }


    // =========================
    // UPDATE PAYMENT + RESERVATION
    // =========================

    async function updatePayment(
      paymentId,
      reservationId,
      newStatus
    ) {

      const paymentResult =
        await supabaseClient
          .from("payments")
          .update({
            status: newStatus
          })
          .eq(
            "id",
            paymentId
          );


      if (paymentResult.error) {

        console.error(
          paymentResult.error
        );

        alert(
          "❌ Could not update payment."
        );

        return;

      }


      const reservationResult =
        await supabaseClient
          .from("reservations")
          .update({
            status: newStatus
          })
          .eq(
            "id",
            reservationId
          );


      if (reservationResult.error) {

        console.error(
          reservationResult.error
        );

        alert(
          "⚠️ Payment updated, but reservation could not be updated."
        );

        loadPayments();
        loadReservations();

        return;

      }


      alert(
        "✅ Payment and reservation updated."
      );


      loadPayments();

      loadReservations();

    }


    // =========================
    // START
    // =========================

    loadReservations();

    loadPayments();

  </script>

</body>

</html>
