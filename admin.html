<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Hotel Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
  color:#222;
}

h1{
  text-align:center;
}

h2{
  margin-top:35px;
}

.controls{
  max-width:750px;
  margin:20px auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,
select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.card{
  background:white;
  padding:20px;
  margin:15px auto;
  max-width:750px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.row{
  margin:8px 0;
  line-height:1.5;
}

.label{
  font-weight:bold;
}

.status{
  font-weight:bold;
  text-transform:capitalize;
}

.pending{
  color:#d68b00;
}

.confirmed,
.approved{
  color:#16833b;
}

.rejected{
  color:#c62828;
}

.cancelled{
  color:#c62828;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin:8px 5px 0 0;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.confirm{
  background:#2e9d50;
  color:white;
}

.reject{
  background:#d33;
  color:white;
}

.refresh{
  background:#333;
  color:white;
  width:100%;
  margin-top:10px;
}

.receipt{
  display:inline-block;
  margin-top:8px;
  color:#9b7b12;
  font-weight:bold;
  text-decoration:none;
}

.receipt:hover{
  text-decoration:underline;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #eee;
}

.empty{
  text-align:center;
  padding:20px;
  background:white;
  border-radius:10px;
  max-width:750px;
  margin:15px auto;
}

.notice{
  padding:12px;
  background:#fff4d6;
  border-radius:8px;
  margin-top:12px;
}

.items-box{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.order-item:last-child{
  border-bottom:none;
}

.order-total{
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
  text-align:right;
}

.order-card{
  border-left:5px solid #d4af37;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  background:#fff4d6;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.cancellation-box{
  background:#fff0f0;
  border:2px solid #e1a4a4;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
}

.food-cancellation{
  background:#fff8e8;
  border:2px solid #d4af37;
}

.refund-box{
  background:#f3fff5;
  border:1px solid #55b875;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
}

.refund-amount{
  color:#16833b;
  font-size:20px;
  font-weight:bold;
}

.account-box{
  background:#f5f5f5;
  border:1px solid #ddd;
  border-radius:8px;
  padding:12px;
  margin-top:10px;
  word-break:break-word;
}

.reason-box{
  background:white;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
  white-space:pre-wrap;
  word-break:break-word;
}

@media(max-width:600px){

body{
  padding:12px;
}

.card{
  padding:15px;
}

.order-item{
  flex-direction:column;
  gap:3px;
}

}

</style>

</head>

<body>


<h1>🏨 Hotel Admin</h1>


<div class="controls">

<strong>
🔎 Search
</strong>


<input
id="search"
type="text"
placeholder="Reservation ID, order ID, name, phone, room or table..."
oninput="filterCards()"
>


<select
id="statusFilter"
onchange="filterCards()"
>

<option value="all">
All statuses
</option>

<option value="pending">
🟡 Pending
</option>

<option value="confirmed">
✅ Confirmed
</option>

<option value="rejected">
❌ Rejected
</option>

<option value="approved">
✅ Approved
</option>

<option value="cancelled">
❌ Cancelled
</option>

</select>


<select
id="typeFilter"
onchange="filterCards()"
>

<option value="all">
All Types
</option>

<option value="reservation">
🏨 Room Reservation
</option>

<option value="payment">
💳 Room Payment
</option>

<option value="order">
🍽️ Food & Table Order
</option>

<option value="cancellation">
❌ Cancellation
</option>

</select>


<button
class="refresh"
onclick="loadEverything()"
>

🔄 Refresh

</button>

</div>


<h2>
📋 Room Reservations
</h2>

<div id="reservations">
Loading reservations...
</div>


<h2>
🍽️ Food & Table Orders
</h2>

<div id="orders">
Loading orders...
</div>


<h2>
❌ Food & Table Cancellation Requests
</h2>

<div id="orderCancellations">
Loading cancellation requests...
</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js"></script>


<script>


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let allCards = [];

let allOrders = [];

let allCancellations = [];


// =========================
// LOAD EVERYTHING
// =========================

async function loadEverything(){

document.getElementById(
"reservations"
).innerHTML =
"Loading reservations...";


document.getElementById(
"orders"
).innerHTML =
"Loading orders...";


document.getElementById(
"orderCancellations"
).innerHTML =
"Loading cancellation requests...";


/* =========================
   RESERVATIONS
   ========================= */

const reservationResult =
await supabaseClient

.from("reservations")

.select(`
*,
customers(name,phone),
rooms(name,room_number)
`)

.order(
"created_at",
{
ascending:false
}
);


if(reservationResult.error){

console.error(
reservationResult.error
);

document.getElementById(
"reservations"
).innerHTML =
"❌ Could not load reservations.";

allCards = [];

}else{

const reservations =
reservationResult.data || [];


/* =========================
   PAYMENTS
   ========================= */

const paymentResult =
await supabaseClient

.from("payments")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


const payments =
paymentResult.error
? []
: paymentResult.data || [];


/* =========================
   ROOM CANCELLATIONS
   ========================= */

const cancellationResult =
await supabaseClient

.from("cancellations")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


const cancellations =
cancellationResult.error
? []
: cancellationResult.data || [];


allCards =
reservations.map(
reservation => {

const payment =
payments.find(
p =>
p.reservation_id ===
reservation.id
);


const cancellation =
cancellations.find(
c =>
c.reservation_id ===
reservation.id
);


return {

reservation,
payment,
cancellation

};

});

}


/* =========================
   FOOD ORDERS
   ========================= */

const orderResult =
await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(orderResult.error){

console.error(
orderResult.error
);

document.getElementById(
"orders"
).innerHTML =
"❌ Could not load food orders.";

allOrders = [];

}else{

allOrders =
orderResult.data || [];

}


/* =========================
   ALL CANCELLATIONS
   ========================= */

const allCancellationResult =
await supabaseClient

.from("cancellations")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(allCancellationResult.error){

console.error(
allCancellationResult.error
);

allCancellations = [];

}else{

allCancellations =
allCancellationResult.data || [];

}


filterCards();

}


// =========================
// FILTER
// =========================

function filterCards(){

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const status =
document
.getElementById("statusFilter")
.value;


const type =
document
.getElementById("typeFilter")
.value;


/* =========================
   ROOM RESERVATIONS
   ========================= */

const filteredReservations =
allCards.filter(
item => {

const r =
item.reservation;

const c =
r.customers || {};

const room =
r.rooms || {};

const p =
item.payment;

const x =
item.cancellation;


const searchable = `

${r.reservation_code}

${c.name || ""}

${c.phone || ""}

${room.name || ""}

${room.room_number || ""}

`.toLowerCase();


if(
search &&
!searchable.includes(search)
){

return false;

}


if(type === "reservation"){

if(status !== "all"){

return r.status === status;

}

return true;

}


if(type === "payment"){

if(!p){

return false;

}

if(status !== "all"){

return p.status === status;

}

return true;

}


if(type === "order" ||
type === "cancellation"){

return false;

}


if(status === "all"){

return true;

}


return (

r.status === status ||

(p && p.status === status) ||

(x && x.status === status)

);

});


displayCards(
filteredReservations
);


/* =========================
   FOOD ORDERS
   ========================= */

const filteredOrders =
allOrders.filter(
order => {

const searchable = `

${order.order_code || ""}

${order.table_number || ""}

${order.arrival_time || ""}

`.toLowerCase();


if(
search &&
!searchable.includes(search)
){

return false;

}


if(type !== "all" &&
type !== "order"){

return false;

}


if(
status !== "all" &&
order.status !== status
){

return false;

}


return true;

});


displayOrders(
filteredOrders
);


/* =========================
   FOOD CANCELLATIONS
   ========================= */

const filteredCancellations =
allCancellations.filter(
cancellation => {

if(!cancellation.order_id){

return false;

}


const order =
allOrders.find(
o =>
o.id ===
cancellation.order_id
);


const searchable = `

${cancellation.id || ""}

${cancellation.order_id || ""}

${order?.order_code || ""}

${order?.table_number || ""}

${cancellation.refund_account || ""}

${cancellation.reason || ""}

`.toLowerCase();


if(
search &&
!searchable.includes(search)
){

return false;

}


if(
type !== "all" &&
type !== "cancellation"
){

return false;

}


if(
status !== "all" &&
cancellation.status !== status
){

return false;

}


return true;

});


displayOrderCancellations(
filteredCancellations
);

}


// =========================
// DISPLAY ROOM RESERVATIONS
// =========================

function displayCards(cards){

const container =
document.getElementById(
"reservations"
);


if(!cards.length){

container.innerHTML =
'<div class="empty">No matching room reservations.</div>';

return;

}


container.innerHTML = "";


cards.forEach(
item => {

const r =
item.reservation;

const c =
r.customers || {};

const room =
r.rooms || {};

const p =
item.payment;

const x =
item.cancellation;


let paymentHTML = "";


if(p){

paymentHTML = `

<div class="section-title">
💳 Payment
</div>

<div class="row">

<span class="label">
Amount:
</span>

${Number(
p.amount || 0
).toFixed(2)}
ETB

</div>


<div class="row">

<span class="label">
Status:
</span>

<span
class="status ${escapeHTML(p.status)}"
>

${escapeHTML(p.status)}

</span>

</div>


${
p.receipt_url

?

`

<a
class="receipt"
href="${escapeAttribute(p.receipt_url)}"
target="_blank"
rel="noopener"
>

🔗 Open Receipt

</a>

`

:

`

<div class="notice">
No receipt URL submitted.
</div>

`
}


${
p.status === "pending"

?

`

<br>

<button
class="confirm"
onclick="updatePayment(
${p.id},
${r.id},
'confirmed'
)"
>

✅ Confirm

</button>


<button
class="reject"
onclick="updatePayment(
${p.id},
${r.id},
'rejected'
)"
>

❌ Reject

</button>

`

:

""

}

`;

}else{

paymentHTML = `

<div class="section-title">
💳 Payment
</div>

<div class="notice">
No payment submitted yet.
</div>

`;

}


let cancellationHTML = "";


if(x){

cancellationHTML = `

<div class="section-title">
❌ Cancellation Request
</div>


<div class="row">

<span class="label">
Reason:
</span>

<div class="reason-box">
${escapeHTML(
x.reason || "—"
)}
</div>

</div>


<div class="row">

<span class="label">
Refund:
</span>

${Number(
x.refund_amount || 0
).toFixed(2)}
ETB

</div>


<div class="row">

<span class="label">
Status:
</span>

<span
class="status ${escapeHTML(x.status)}"
>

${escapeHTML(x.status)}

</span>

</div>


${
x.refund_account

?

`

<div class="account-box">

<span class="label">
🏦 Refund Account:
</span>

<br>

${escapeHTML(
x.refund_account
)}

</div>

`

:

""

}


${
x.status === "pending"

?

`

<button
class="confirm"
onclick="updateCancellation(
${x.id},
${r.id},
'approved'
)"
>

✅ Approve

</button>


<button
class="reject"
onclick="updateCancellation(
${x.id},
${r.id},
'rejected'
)"
>

❌ Reject

</button>

`

:

""

}

`;

}


container.innerHTML += `

<div class="card">

<h3>

📋 ${escapeHTML(
r.reservation_code ||
"Unknown"
)}

</h3>


<div class="row">

<span class="label">
Customer:
</span>

${escapeHTML(
c.name || "—"
)}

</div>


<div class="row">

<span class="label">
Phone:
</span>

${escapeHTML(
c.phone || "—"
)}

</div>


<div class="row">

<span class="label">
Room:
</span>

${escapeHTML(
room.name || "—"
)}

(${escapeHTML(
room.room_number || "—"
)})

</div>


<div class="row">

<span class="label">
Check-in:
</span>

${formatDate(
r.check_in
)}

</div>


<div class="row">

<span class="label">
Check-out:
</span>

${formatDate(
r.check_out
)}

</div>


<div class="row">

<span class="label">
Total:
</span>

${Number(
r.total_amount || 0
).toFixed(2)}
ETB

</div>


<div class="row">

<span class="label">
Reservation:
</span>

<span
class="status ${escapeHTML(r.status)}"
>

${escapeHTML(r.status)}

</span>

</div>


${paymentHTML}

${cancellationHTML}

</div>

`;

});

}


// =========================
// DISPLAY FOOD ORDERS
// =========================

function displayOrders(orders){

const container =
document.getElementById(
"orders"
);


if(!orders.length){

container.innerHTML =
'<div class="empty">No matching food & table orders.</div>';

return;

}


container.innerHTML = "";


orders.forEach(
order => {

const status =
order.status ||
"pending";


let items = [];


try{

if(Array.isArray(order.items)){

items =
order.items;

}

else if(
typeof order.items === "string"
){

items =
JSON.parse(order.items);

}

}catch(error){

console.error(
"Could not read order items:",
error
);

items = [];

}


let itemsHTML = "";


if(items.length){

itemsHTML =
items.map(
item => {

const quantity =
Number(
item.quantity || 0
);

const price =
Number(
item.price || 0
);

const amount =
quantity * price;


const icon =
item.type === "drink"
? "🥤"
: "🍽️";


return `

<div class="order-item">

<span>

${icon}
${escapeHTML(
item.name || "Item"
)}
× ${quantity}

</span>

<span>

${amount.toFixed(2)}
ETB

</span>

</div>

`;

}).join("");

}else{

itemsHTML = `

<div class="notice">
No items found.
</div>

`;

}


const receiptHTML =
order.receipt_url

?

`

<a
class="receipt"
href="${escapeAttribute(order.receipt_url)}"
target="_blank"
rel="noopener"
>

🔗 Open Payment Receipt

</a>

`

:

`

<div class="notice">

💳 No payment receipt submitted yet.

</div>

`;


const actionHTML =
status === "pending"

?

`

<button
class="confirm"
onclick="updateOrder(
${order.id},
'confirmed'
)"
>

✅ Confirm Order

</button>


<button
class="reject"
onclick="updateOrder(
${order.id},
'rejected'
)"
>

❌ Reject Order

</button>

`

:

"";


container.innerHTML += `

<div class="card order-card">

<div class="badge">
🍽️ FOOD & TABLE ORDER
</div>


<h3>

📋 ${escapeHTML(
order.order_code ||
"Unknown"
)}

</h3>


<div class="row">

<span class="label">
Table:
</span>

🪑 Table ${escapeHTML(
String(
order.table_number || "—"
)
)}

</div>


<div class="row">

<span class="label">
Estimated Arrival:
</span>

🕐 ${escapeHTML(
order.arrival_time || "—"
)}

</div>


<div class="row">

<span class="label">
Status:
</span>

<span
class="status ${escapeHTML(status)}"
>

${escapeHTML(status)}

</span>

</div>


<div class="section-title">

🍽️ Ordered Items

</div>


<div class="items-box">

${itemsHTML}

<div class="order-total">

Total:
${Number(
order.total_amount || 0
).toFixed(2)}
ETB

</div>

</div>


<div class="section-title">

💳 Payment

</div>


${receiptHTML}


<div>

${actionHTML}

</div>


</div>

`;

});

}


// =========================
// DISPLAY FOOD CANCELLATIONS
// =========================

function displayOrderCancellations(cancellations){

const container =
document.getElementById(
"orderCancellations"
);


if(!cancellations.length){

container.innerHTML =
'<div class="empty">No food & table cancellation requests.</div>';

return;

}


container.innerHTML = "";


cancellations.forEach(
cancellation => {

const order =
allOrders.find(
o =>
o.id ===
cancellation.order_id
);


if(!order){

return;

}


const amount =
Number(
order.total_amount || 0
);


const refundAmount =
Number(
cancellation.refund_amount ||
amount * 0.50
);


const fee =
amount -
refundAmount;


let items = [];


try{

if(Array.isArray(order.items)){

items =
order.items;

}else if(
typeof order.items === "string"
){

items =
JSON.parse(order.items);

}

}catch(error){

items = [];

}


let itemsHTML = "";


if(items.length){

itemsHTML =
items.map(
item => {

const quantity =
Number(
item.quantity || 0
);

const price =
Number(
item.price || 0
);

return `

<div class="order-item">

<span>

${item.type === "drink" ? "🥤" : "🍽️"}

${escapeHTML(
item.name || "Item"
)}

× ${quantity}

</span>

<span>

${(
quantity * price
).toFixed(2)}
ETB

</span>

</div>

`;

}).join("");

}


const actionHTML =
cancellation.status === "pending"

?

`

<button
class="confirm"
onclick="updateOrderCancellation(
${cancellation.id},
${order.id},
'approved'
)"
>

✅ Approve 50% Refund

</button>


<button
class="reject"
onclick="updateOrderCancellation(
${cancellation.id},
${order.id},
'rejected'
)"
>

❌ Reject Cancellation

</button>

`

:

"";


container.innerHTML += `

<div class="card cancellation-box food-cancellation">

<div class="badge">
🍽️ FOOD & TABLE CANCELLATION
</div>


<h3>

📋 ${escapeHTML(
order.order_code ||
"Unknown"
)}

</h3>


<div class="row">

<span class="label">
Table:
</span>

🪑 Table ${escapeHTML(
String(
order.table_number || "—"
)
)}

</div>


<div class="row">

<span class="label">
Original Order Total:
</span>

${amount.toFixed(2)}
ETB

</div>


<div class="section-title">
🍽️ Ordered Items
</div>


<div class="items-box">

${itemsHTML}

</div>


<div class="section-title">
❌ Cancellation Details
</div>


<div class="row">

<span class="label">
Reason:
</span>

<div class="reason-box">

${escapeHTML(
cancellation.reason || "—"
)}

</div>

</div>


<div class="refund-box">

<div>

<span class="label">
Original amount:
</span>

${amount.toFixed(2)}
ETB

</div>


<div style="margin-top:8px">

<span class="label">
Refund percentage:
</span>

50%

</div>


<div style="margin-top:8px">

<span class="label">
Refund amount:
</span>

<span class="refund-amount">

${refundAmount.toFixed(2)}
ETB

</span>

</div>


<div style="margin-top:8px">

<span class="label">
Cancellation fee:
</span>

${fee.toFixed(2)}
ETB

</div>

</div>


${
cancellation.refund_account

?

`

<div class="account-box">

<span class="label">
🏦 Customer Refund Account:
</span>

<br><br>

${escapeHTML(
cancellation.refund_account
)}

</div>

`

:

`

<div class="notice">

⚠️ Customer did not provide a refund account.

</div>

`

}


<div class="row">

<span class="label">
Cancellation Status:
</span>

<span
class="status ${escapeHTML(
cancellation.status
)}"
>

${escapeHTML(
cancellation.status
)}

</span>

</div>


<div>

${actionHTML}

</div>


</div>

`;

});

}

);

loadEverything();

}


// =========================
// UPDATE ROOM PAYMENT
// =========================

async function updatePayment(
paymentId,
reservationId,
newStatus
){

const paymentResult =
await supabaseClient

.from("payments")

.update({
status:newStatus
})

.eq(
"id",
paymentId
);


if(paymentResult.error){

console.error(
paymentResult.error
);

alert(
"❌ Could not update payment."
);

return;

}


const reservationResult =
await supabaseClient

.from("reservations")

.update({
status:newStatus
})

.eq(
"id",
reservationId
);


if(reservationResult.error){

console.error(
reservationResult.error
);

alert(
"⚠️ Payment updated, but reservation could not be updated."
);

loadEverything();

return;

}


/* =========================
   GET CUSTOMER
   ========================= */

const customerResult =
await supabaseClient

.from("reservations")

.select(`
customer_id,
reservation_code
`)

.eq(
"id",
reservationId
)

.single();


if(customerResult.error){

console.error(
customerResult.error
);

alert(
"⚠️ Payment updated, but customer notification could not be created."
);

loadEverything();

return;

}


/* =========================
   NOTIFICATION
   ========================= */

const title =
newStatus === "confirmed"

?

"💳 Payment Confirmed"

:

"💳 Payment Rejected";


const notificationMessage =
newStatus === "confirmed"

?

`Your payment for reservation ${customerResult.data.reservation_code} has been confirmed.`

:

`Your payment for reservation ${customerResult.data.reservation_code} has been rejected.`;


const notificationResult =
await supabaseClient

.from("notifications")

.insert({

customer_id:
customerResult.data.customer_id,

reservation_id:
reservationId,

type:
"payment",

title:
title,

message:
notificationMessage,

is_read:
false

});


if(notificationResult.error){

console.error(
notificationResult.error
);

alert(
"⚠️ Payment updated, but notification could not be created."
);

loadEverything();

return;

}


alert(

newStatus === "confirmed"

?

"✅ Payment confirmed and customer notified."

:

"✅ Payment rejected and customer notified."

);


loadEverything();

}

function formatDate(date){

if(!date){

return "—";

}


return new Date(
date
).toLocaleDateString();

}


// =========================
// ESCAPE HTML
// =========================

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


// =========================
// ESCAPE URL
// =========================

function escapeAttribute(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
);

}
