<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Hotel Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
  min-height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
  text-align:center;
}

.login-card h1{
  margin-top:0;
}

.login-card p{
  color:#666;
}

#adminPin{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:18px;
  text-align:center;
  letter-spacing:4px;
}

.login-button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-error{
  color:#c62828;
  margin-top:15px;
  min-height:20px;
}

.login-success{
  color:#16833b;
  margin-top:15px;
}


/* =====================================================
   ADMIN
===================================================== */

#adminApp{
  display:none;
}

.admin-header{
  position:relative;
  max-width:700px;
  margin:0 auto;
}

h1{
  text-align:center;
}

h2{
  margin-top:35px;
}

.logout-button{
  display:block;
  margin:10px auto 20px;
  background:#c62828;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
  max-width:700px;
  margin:20px auto;
  background:white;
  padding:15px;
  border-radius:12px;
}

input,
select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.card{
  background:white;
  padding:20px;
  margin:15px auto;
  max-width:700px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.row{
  margin:8px 0;
}

.label{
  font-weight:bold;
}

.status{
  font-weight:bold;
  text-transform:capitalize;
}

.pending{
  color:#d68b00;
}

.confirmed,
.approved{
  color:#16833b;
}

.rejected{
  color:#c62828;
}

.cancelled{
  color:#c62828;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin:8px 5px 0 0;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.confirm{
  background:#2e9d50;
  color:white;
}

.reject{
  background:#d33;
  color:white;
}

.refresh{
  background:#333;
  color:white;
  width:100%;
  margin-top:10px;
}

.receipt{
  display:inline-block;
  margin-top:8px;
  color:#9b7b12;
  font-weight:bold;
  text-decoration:none;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #eee;
}

.empty{
  text-align:center;
  padding:20px;
  background:white;
  border-radius:10px;
  max-width:700px;
  margin:15px auto;
}

.notice{
  padding:12px;
  background:#fff4d6;
  border-radius:8px;
  margin-top:12px;
}

.items-box{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.order-item:last-child{
  border-bottom:none;
}

.order-total{
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
  text-align:right;
}

.order-card{
  border-left:5px solid #d4af37;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:6px;
  background:#fff4d6;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.room-card{
  border-left:5px solid #555;
}

.cancel-card{
  border-left:5px solid #c62828;
}

</style>

</head>

<body>


<!-- =====================================================
     ADMIN LOGIN SCREEN
===================================================== -->

<div id="loginScreen">

  <div class="login-card">

    <h1>🏨 Hotel Admin</h1>

    <p>
      Enter the administrator PIN to continue.
    </p>

    <input
      id="adminPin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Admin PIN"
    >

    <button
      id="loginButton"
      class="login-button"
      onclick="adminLogin()"
    >
      🔐 Login
    </button>

    <div
      id="loginMessage"
      class="login-error"
    ></div>

  </div>

</div>


<!-- =====================================================
     ADMIN APPLICATION
===================================================== -->

<div id="adminApp">

  <div class="admin-header">

    <h1>🏨 Hotel Admin</h1>

    <button
      class="logout-button"
      onclick="adminLogout()"
    >
      🚪 Logout
    </button>

  </div>


  <div class="controls">

    <strong>
      🔎 Search
    </strong>


    <input
      id="search"
      type="text"
      placeholder="Reservation ID, order ID, name, phone, room or table..."
      oninput="filterCards()"
    >


    <select
      id="statusFilter"
      onchange="filterCards()"
    >

      <option value="all">
        All statuses
      </option>

      <option value="pending">
        🟡 Pending
      </option>

      <option value="confirmed">
        ✅ Confirmed
      </option>

      <option value="rejected">
        ❌ Rejected
      </option>

      <option value="approved">
        ✅ Approved
      </option>

      <option value="cancelled">
        ❌ Cancelled
      </option>

    </select>


    <select
      id="typeFilter"
      onchange="filterCards()"
    >

      <option value="all">
        All Types
      </option>

      <option value="reservation">
        🏨 Room Reservation
      </option>

      <option value="payment">
        💳 Room Payment
      </option>

      <option value="order">
        🍽️ Food & Table Order
      </option>

      <option value="cancellation">
        ❌ Cancellation
      </option>

    </select>


    <button
      class="refresh"
      onclick="loadEverything()"
    >

      🔄 Refresh

    </button>

  </div>


  <h2>
    📋 Room Reservations
  </h2>


  <div id="reservations">
    Loading reservations...
  </div>


  <h2>
    🍽️ Food & Table Orders
  </h2>


  <div id="orders">
    Loading orders...
  </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js"></script>


<script>


// =====================================================
// SUPABASE
// =====================================================

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================================
// ADMIN LOGIN STATE
// =====================================================

let adminAuthenticated =
sessionStorage.getItem(
  "hotel_admin_authenticated"
) === "true";


let allCards = [];

let allOrders = [];


// =====================================================
// START APPLICATION
// =====================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    updateAdminScreen();

    const pinInput =
      document.getElementById(
        "adminPin"
      );

    if(pinInput){

      pinInput.addEventListener(
        "keydown",
        function(event){

          if(
            event.key === "Enter"
          ){

            adminLogin();

          }

        }
      );

    }

  }
);


// =====================================================
// UPDATE LOGIN / ADMIN SCREEN
// =====================================================

function updateAdminScreen(){

  const loginScreen =
    document.getElementById(
      "loginScreen"
    );

  const adminApp =
    document.getElementById(
      "adminApp"
    );


  if(adminAuthenticated){

    loginScreen.style.display =
      "none";

    adminApp.style.display =
      "block";

    loadEverything();

  }else{

    loginScreen.style.display =
      "flex";

    adminApp.style.display =
      "none";

  }

}


// =====================================================
// ADMIN LOGIN
// =====================================================

async function adminLogin(){

  const pinInput =
    document.getElementById(
      "adminPin"
    );

  const loginButton =
    document.getElementById(
      "loginButton"
    );

  const message =
    document.getElementById(
      "loginMessage"
    );


  const pin =
    pinInput.value.trim();


  message.textContent = "";

  message.className =
    "login-error";


  if(!pin){

    message.textContent =
      "Please enter the admin PIN.";

    return;

  }


  loginButton.disabled =
    true;

  loginButton.textContent =
    "🔐 Checking...";


  try{

    const result =
      await supabaseClient.rpc(
        "admin_login",
        {
          p_pin: pin
        }
      );


    if(result.error){

      console.error(
        "Admin login error:",
        result.error
      );

      message.textContent =
        "❌ Login failed: " +
        result.error.message;

      return;

    }


    const data =
      result.data;


    if(
      data &&
      data.success === true
    ){

      // -------------------------------------------------
      // Successful login
      // -------------------------------------------------

      adminAuthenticated =
        true;


      sessionStorage.setItem(
        "hotel_admin_authenticated",
        "true"
      );


      pinInput.value = "";


      message.textContent =
        "✅ Login successful.";

      message.className =
        "login-success";


      updateAdminScreen();


    }else{

      message.textContent =
        data &&
        data.message

        ?

        "❌ " +
        data.message

        :

        "❌ Invalid admin PIN.";

    }


  }catch(error){

    console.error(
      "Admin login exception:",
      error
    );

    message.textContent =
      "❌ Could not connect to admin login.";

  }finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      "🔐 Login";

  }

}


// =====================================================
// ADMIN LOGOUT
// =====================================================

function adminLogout(){

  adminAuthenticated =
    false;


  sessionStorage.removeItem(
    "hotel_admin_authenticated"
  );


  allCards = [];

  allOrders = [];


  document.getElementById(
    "reservations"
  ).innerHTML = "";


  document.getElementById(
    "orders"
  ).innerHTML = "";


  document.getElementById(
    "loginMessage"
  ).textContent = "";


  updateAdminScreen();

}


// =====================================================
// SECURITY CHECK
// =====================================================

function requireAdmin(){

  if(!adminAuthenticated){

    adminLogout();

    return false;

  }

  return true;

}


// =====================================================
// LOAD EVERYTHING
// =====================================================

async function loadEverything(){

  if(!requireAdmin()){

    return;

  }


  document.getElementById(
    "reservations"
  ).innerHTML =
  "Loading reservations...";


  document.getElementById(
    "orders"
  ).innerHTML =
  "Loading orders...";


  // =====================================================
  // RESERVATIONS
  // =====================================================

  const reservationResult =
    await supabaseClient

    .from("reservations")

    .select(`
      *,
      customers(name,phone),
      rooms(name,room_number,available)
    `)

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(reservationResult.error){

    console.error(
      reservationResult.error
    );


    document.getElementById(
      "reservations"
    ).innerHTML =
      "❌ Could not load reservations.";


    allCards=[];

  }else{

    const reservations =
      reservationResult.data || [];


    // =====================================================
    // PAYMENTS
    // =====================================================

    const paymentResult =
      await supabaseClient

      .from("payments")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    const payments =
      paymentResult.error
      ? []
      : (
        paymentResult.data || []
      );


    // =====================================================
    // CANCELLATIONS
    // =====================================================

    const cancellationResult =
      await supabaseClient

      .from("cancellations")

      .select("*")

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    const cancellations =
      cancellationResult.error
      ? []
      : (
        cancellationResult.data || []
      );


    // =====================================================
    // COMBINE RESERVATION DATA
    // =====================================================

    allCards =
      reservations.map(
        reservation => {

          const payment =
            payments.find(
              p =>
                p.reservation_id ===
                reservation.id
            );


          const cancellation =
            cancellations.find(
              c =>
                c.reservation_id ===
                reservation.id
            );


          return {

            reservation,
            payment,
            cancellation

          };

        }
      );

  }


  // =====================================================
  // FOOD / TABLE ORDERS
  // =====================================================

  const orderResult =
    await supabaseClient

    .from("orders")

    .select("*")

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(orderResult.error){

    console.error(
      orderResult.error
    );


    document.getElementById(
      "orders"
    ).innerHTML =
      "❌ Could not load food orders.";


    allOrders=[];

  }else{

    allOrders =
      orderResult.data || [];

  }


  filterCards();

}


// =====================================================
// FILTER
// =====================================================

function filterCards(){

  if(!requireAdmin()){

    return;

  }


  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


  const status =
    document
    .getElementById("statusFilter")
    .value;


  const type =
    document
    .getElementById("typeFilter")
    .value;


  // =====================================================
  // FILTER RESERVATIONS
  // =====================================================

  const filteredReservations =
    allCards.filter(
      item => {

        const r =
          item.reservation;

        const c =
          r.customers || {};

        const room =
          r.rooms || {};

        const p =
          item.payment;

        const x =
          item.cancellation;


        const searchable = `

          ${r.id || ""}

          ${r.reservation_code || ""}

          ${c.name || ""}

          ${c.phone || ""}

          ${room.name || ""}

          ${room.room_number || ""}

        `.toLowerCase();


        if(
          search &&
          !searchable.includes(search)
        ){

          return false;

        }


        // ROOM RESERVATION

        if(
          type === "reservation"
        ){

          if(status !== "all"){

            return r.status === status;

          }

          return true;

        }


        // PAYMENT

        if(
          type === "payment"
        ){

          if(!p){

            return false;

          }


          if(status !== "all"){

            return p.status === status;

          }

          return true;

        }


        // CANCELLATION

        if(
          type === "cancellation"
        ){

          if(!x){

            return false;

          }


          if(status !== "all"){

            return x.status === status;

          }

          return true;

        }


        // ORDER DOES NOT BELONG HERE

        if(
          type === "order"
        ){

          return false;

        }


        // STATUS ONLY

        if(status === "all"){

          return true;

        }


        return (

          r.status === status ||

          (
            p &&
            p.status === status
          ) ||

          (
            x &&
            x.status === status
          )

        );

      }
    );


  displayCards(
    filteredReservations
  );


  // =====================================================
  // FILTER ORDERS
  // =====================================================

  const filteredOrders =
    allOrders.filter(
      order => {

        const searchable = `

          ${order.id || ""}

          ${order.order_code || ""}

          ${order.customer_name || ""}

          ${order.customer_phone || ""}

          ${order.table_number || ""}

          ${order.arrival_time || ""}

        `.toLowerCase();


        if(
          search &&
          !searchable.includes(search)
        ){

          return false;

        }


        if(
          type !== "all" &&
          type !== "order"
        ){

          return false;

        }


        if(
          status !== "all" &&
          order.status !== status
        ){

          return false;

        }


        return true;

      }
    );


  displayOrders(
    filteredOrders
  );

}


// =====================================================
// DISPLAY ROOM RESERVATIONS
// =====================================================

function displayCards(cards){

  const container =
    document.getElementById(
      "reservations"
    );


  if(!cards.length){

    container.innerHTML =
      '<div class="empty">No matching room reservations.</div>';

    return;

  }


  container.innerHTML = "";


  cards.forEach(
    item => {

      const r =
        item.reservation;

      const c =
        r.customers || {};

      const room =
        r.rooms || {};

      const p =
        item.payment;

      const x =
        item.cancellation;


      // =====================================================
      // PAYMENT HTML
      // =====================================================

      let paymentHTML = "";


      if(p){

        paymentHTML = `

          <div class="section-title">
            💳 Payment
          </div>


          <div class="row">

            <span class="label">
              Amount:
            </span>

            ${Number(
              p.amount || 0
            ).toFixed(2)}

            ETB

          </div>


          <div class="row">

            <span class="label">
              Status:
            </span>

            <span
              class="status ${escapeHTML(p.status)}"
            >

              ${escapeHTML(
                p.status
              )}

            </span>

          </div>


          ${
            p.receipt_url

            ?

            `

            <a
              class="receipt"
              href="${escapeAttribute(p.receipt_url)}"
              target="_blank"
              rel="noopener"
            >

              🔗 Open Receipt

            </a>

            `

            :

            `

            <div class="notice">
              No receipt URL submitted.
            </div>

            `

          }


          ${
            p.status === "pending"

            ?

            `

            <br>

            <button
              class="confirm"
              onclick="updatePayment(
                ${Number(p.id)},
                ${Number(r.id)},
                'confirmed'
              )"
            >

              ✅ Confirm Payment

            </button>


            <button
              class="reject"
              onclick="updatePayment(
                ${Number(p.id)},
                ${Number(r.id)},
                'rejected'
              )"
            >

              ❌ Reject Payment

            </button>

            `

            :

            ""

          }

        `;

      }else{

        paymentHTML = `

          <div class="section-title">
            💳 Payment
          </div>

          <div class="notice">
            No payment submitted yet.
          </div>

        `;

      }


      // =====================================================
      // CANCELLATION HTML
      // =====================================================

      let cancellationHTML = "";


      if(x){

        cancellationHTML = `

          <div class="section-title">
            ❌ Cancellation Request
          </div>


          <div class="row">

            <span class="label">
              Reason:
            </span>

            ${escapeHTML(
              x.reason || "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Refund:
            </span>

            ${Number(
              x.refund_amount || 0
            ).toFixed(2)}

            ETB

          </div>


          <div class="row">

            <span class="label">
              Status:
            </span>

            <span
              class="status ${escapeHTML(x.status)}"
            >

              ${escapeHTML(
                x.status
              )}

            </span>

          </div>


          ${
            x.status === "pending"

            ?

            `

            <button
              class="confirm"
              onclick="updateCancellation(
                ${Number(x.id)},
                ${Number(r.id)},
                'approved'
              )"
            >

              ✅ Approve Cancellation

            </button>


            <button
              class="reject"
              onclick="updateCancellation(
                ${Number(x.id)},
                ${Number(r.id)},
                'rejected'
              )"
            >

              ❌ Reject Cancellation

            </button>

            `

            :

            ""

          }

        `;

      }


      // =====================================================
      // ROOM CARD
      // =====================================================

      container.innerHTML += `

        <div class="card room-card">

          <h3>

            📋 ${escapeHTML(
              r.reservation_code ||
              "Unknown"
            )}

          </h3>


          <div class="row">

            <span class="label">
              Customer:
            </span>

            ${escapeHTML(
              c.name || "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Phone:
            </span>

            ${escapeHTML(
              c.phone || "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Room:
            </span>

            ${escapeHTML(
              room.name || "—"
            )}

            (

            ${escapeHTML(
              room.room_number || "—"
            )}

            )

          </div>


          <div class="row">

            <span class="label">
              Room Available:
            </span>

            ${
              room.available === true

              ?

              '<span class="status confirmed">Yes</span>'

              :

              '<span class="status cancelled">No</span>'

            }

          </div>


          <div class="row">

            <span class="label">
              Check-in:
            </span>

            ${formatDate(
              r.check_in
            )}

          </div>


          <div class="row">

            <span class="label">
              Check-out:
            </span>

            ${formatDate(
              r.check_out
            )}

          </div>


          <div class="row">

            <span class="label">
              Total:
            </span>

            ${Number(
              r.total_amount || 0
            ).toFixed(2)}

            ETB

          </div>


          <div class="row">

            <span class="label">
              Reservation:
            </span>

            <span
              class="status ${escapeHTML(r.status)}"
            >

              ${escapeHTML(
                r.status
              )}

            </span>

          </div>


          ${paymentHTML}

          ${cancellationHTML}

        </div>

      `;

    }
  );

}


// =====================================================
// DISPLAY FOOD ORDERS
// =====================================================

function displayOrders(orders){

  const container =
    document.getElementById(
      "orders"
    );


  if(!orders.length){

    container.innerHTML =
      '<div class="empty">No matching food & table orders.</div>';

    return;

  }


  container.innerHTML = "";


  orders.forEach(
    order => {

      const status =
        order.status ||
        "pending";


      let items = [];


      try{

        if(
          Array.isArray(
            order.items
          )
        ){

          items =
            order.items;

        }

        else if(
          typeof order.items ===
          "string"
        ){

          items =
            JSON.parse(
              order.items
            );

        }

      }catch(error){

        console.error(
          "Could not read order items:",
          error
        );

        items = [];

      }


      let itemsHTML = "";


      if(items.length){

        itemsHTML =
          items.map(
            item => {

              const quantity =
                Number(
                  item.quantity || 0
                );


              const price =
                Number(
                  item.price || 0
                );


              const amount =
                quantity *
                price;


              const icon =
                item.type === "drink"
                ? "🥤"
                : "🍽️";


              return `

                <div class="order-item">

                  <span>

                    ${icon}

                    ${escapeHTML(
                      item.name ||
                      "Item"
                    )}

                    × ${quantity}

                  </span>


                  <span>

                    ${amount.toFixed(2)}

                    ETB

                  </span>

                </div>

              `;

            }
          ).join("");

      }else{

        itemsHTML = `

          <div class="notice">

            No items found.

          </div>

        `;

      }


      // =====================================================
      // RECEIPT
      // =====================================================

      const receiptHTML =
        order.receipt_url

        ?

        `

        <a
          class="receipt"
          href="${escapeAttribute(order.receipt_url)}"
          target="_blank"
          rel="noopener"
        >

          🔗 Open Payment Receipt

        </a>

        `

        :

        `

        <div class="notice">

          💳 No payment receipt submitted yet.

        </div>

        `;


      // =====================================================
      // ORDER ACTIONS
      // =====================================================

      const actionHTML =
        status === "pending"

        ?

        `

        <button
          class="confirm"
          onclick="updateOrder(
            ${Number(order.id)},
            'confirmed'
          )"
        >

          ✅ Confirm Order

        </button>


        <button
          class="reject"
          onclick="updateOrder(
            ${Number(order.id)},
            'rejected'
          )"
        >

          ❌ Reject Order

        </button>

        `

        :

        "";


      container.innerHTML += `

        <div class="card order-card">

          <div class="badge">

            🍽️ FOOD & TABLE ORDER

          </div>


          <h3>

            📋 ${escapeHTML(
              order.order_code ||
              "Unknown"
            )}

          </h3>


          <div class="row">

            <span class="label">
              Customer Name:
            </span>

            ${escapeHTML(
              order.customer_name ||
              "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Phone:
            </span>

            ${escapeHTML(
              order.customer_phone ||
              "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Table:
            </span>

            🪑 Table

            ${escapeHTML(
              String(
                order.table_number ||
                "—"
              )
            )}

          </div>


          <div class="row">

            <span class="label">
              Estimated Arrival:
            </span>

            🕐

            ${escapeHTML(
              order.arrival_time ||
              "—"
            )}

          </div>


          <div class="row">

            <span class="label">
              Status:
            </span>

            <span
              class="status ${escapeHTML(status)}"
            >

              ${escapeHTML(status)}

            </span>

          </div>


          <div class="section-title">

            🍽️ Ordered Items

          </div>


          <div class="items-box">

            ${itemsHTML}


            <div class="order-total">

              Total:

              ${Number(
                order.total_amount ||
                0
              ).toFixed(2)}

              ETB

            </div>

          </div>


          <div class="section-title">

            💳 Payment

          </div>


          ${receiptHTML}


          <div>

            ${actionHTML}

          </div>


        </div>

      `;

    }
  );

}


// =====================================================
// UPDATE FOOD / TABLE ORDER + TELEGRAM
// =====================================================

async function updateOrder(
  orderId,
  newStatus
){

  if(!requireAdmin()){

    return;

  }


  const order =
    allOrders.find(
      o =>
        Number(o.id) ===
        Number(orderId)
    );


  const result =
    await supabaseClient

    .from("orders")

    .update({
      status:newStatus,
      updated_at:
        new Date().toISOString()
    })

    .eq(
      "id",
      orderId
    );


  if(result.error){

    console.error(
      result.error
    );


    alert(
      "❌ Could not update order: " +
      result.error.message
    );


    return;

  }


  // =====================================================
  // SEND TELEGRAM ONLY WHEN CONFIRMED
  // =====================================================

  if(
    newStatus === "confirmed" &&
    order
  ){

    try{

      let items = [];


      try{

        if(
          Array.isArray(
            order.items
          )
        ){

          items =
            order.items;

        }

        else if(
          typeof order.items ===
          "string"
        ){

          items =
            JSON.parse(
              order.items
            );

        }

      }catch(error){

        console.error(
          "Could not parse order items:",
          error
        );

        items = [];

      }


      const telegramResponse =
        await fetch(

          "https://wmsjpbcwhqghqtytztvv.supabase.co/functions/v1/dynamic-task",

          {

            method:"POST",

            headers:{

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY

            },

            body:
              JSON.stringify({

                order_code:
                  order.order_code ||
                  "",

                table_number:
                  order.table_number ||
                  "",

                arrival_time:
                  order.arrival_time ||
                  "",

                customer_name:
                  order.customer_name ||
                  "",

                customer_phone:
                  order.customer_phone ||
                  "",

                total_amount:
                  Number(
                    order.total_amount ||
                    0
                  ),

                status:
                  "confirmed",

                items:
                  items

              })

          }

        );


      const telegramResult =
        await telegramResponse.json();


      if(
        !telegramResponse.ok
      ){

        console.error(
          "Telegram notification failed:",
          telegramResult
        );


        alert(
          "⚠️ Order confirmed, but Telegram notification failed."
        );

      }else{

        console.log(
          "✅ Telegram notification sent.",
          telegramResult
        );

      }


    }catch(error){

      console.error(
        "Telegram connection error:",
        error
      );


      alert(
        "⚠️ Order confirmed, but Telegram notification could not be sent."
      );

    }

  }


  alert(

    newStatus === "confirmed"

    ?

    "✅ Food & table order confirmed."

    :

    "❌ Food & table order rejected."

  );


  loadEverything();

}


// =====================================================
// UPDATE ROOM PAYMENT
// =====================================================

async function updatePayment(
  paymentId,
  reservationId,
  newStatus
){

  if(!requireAdmin()){

    return;

  }


  const paymentResult =
    await supabaseClient

    .from("payments")

    .update({
      status:newStatus
    })

    .eq(
      "id",
      paymentId
    );


  if(paymentResult.error){

    console.error(
      paymentResult.error
    );


    alert(
      "❌ Could not update payment: " +
      paymentResult.error.message
    );


    return;

  }


  // =====================================================
  // UPDATE RESERVATION
  // =====================================================

  const reservationResult =
    await supabaseClient

    .from("reservations")

    .update({
      status:newStatus
    })

    .eq(
      "id",
      reservationId
    );


  if(reservationResult.error){

    console.error(
      reservationResult.error
    );


    alert(
      "⚠️ Payment updated, but reservation could not be updated: " +
      reservationResult.error.message
    );


    loadEverything();

    return;

  }


  // =====================================================
  // GET CUSTOMER
  // =====================================================

  const customerResult =
    await supabaseClient

    .from("reservations")

    .select(`
      customer_id,
      reservation_code
    `)

    .eq(
      "id",
      reservationId
    )

    .single();


  if(customerResult.error){

    console.error(
      customerResult.error
    );


    alert(
      "⚠️ Payment updated, but customer notification could not be created."
    );


    loadEverything();

    return;

  }


  // =====================================================
  // NOTIFICATION
  // =====================================================

  const title =
    newStatus === "confirmed"

    ?

    "💳 Payment Confirmed"

    :

    "💳 Payment Rejected";


  const message =
    newStatus === "confirmed"

    ?

    `Your payment for reservation ${customerResult.data.reservation_code} has been confirmed.`

    :

    `Your payment for reservation ${customerResult.data.reservation_code} has been rejected.`;


  const notificationResult =
    await supabaseClient

    .from("notifications")

    .insert({

      customer_id:
        customerResult.data.customer_id,

      reservation_id:
        reservationId,

      type:
        "payment",

      title:
        title,

      message:
        message,

      is_read:
        false

    });


  if(notificationResult.error){

    console.error(
      notificationResult.error
    );


    alert(
      "⚠️ Payment updated, but notification could not be created."
    );


    loadEverything();

    return;

  }


  alert(

    newStatus === "confirmed"

    ?

    "✅ Payment confirmed and customer notified."

    :

    "✅ Payment rejected and customer notified."

  );


  loadEverything();

}


// =====================================================
// CANCELLATION
// =====================================================

async function updateCancellation(
  cancellationId,
  reservationId,
  newStatus
){

  if(!requireAdmin()){

    return;

  }


  if(
    newStatus === "approved"
  ){

    const result =
      await supabaseClient.rpc(
        "approve_cancellation",
        {
          p_cancellation_id:
            cancellationId
        }
      );


    if(result.error){

      console.error(
        result.error
      );


      alert(
        "❌ Could not approve cancellation: " +
        result.error.message
      );


      return;

    }


    alert(
      "✅ Cancellation approved. " +
      "The reservation is cancelled and the room is available again."
    );


  }else{

    const result =
      await supabaseClient

      .from("cancellations")

      .update({
        status:"rejected"
      })

      .eq(
        "id",
        cancellationId
      );


    if(result.error){

      console.error(
        result.error
      );


      alert(
        "❌ Could not reject cancellation: " +
        result.error.message
      );


      return;

    }


    alert(
      "❌ Cancellation rejected."
    );

  }


  loadEverything();

}


// =====================================================
// HELPERS
// =====================================================

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}


function formatDate(value){

  if(!value){

    return "—";

  }


  try{

    return new Date(
      value
    ).toLocaleDateString();

  }catch(error){

    return escapeHTML(
      value
    );

  }

}
