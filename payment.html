<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Payment</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f5f0;
  margin:0;
  padding:20px;
}

.container{
  max-width:500px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.booking-box{
  margin:0 auto 25px;
  padding:18px;
  max-width:330px;
  text-align:center;
  border:2px solid #d4af37;
  border-radius:15px;
  background:#fffdf5;
  box-shadow:
    0 0 8px rgba(212,175,55,.5),
    0 0 25px rgba(212,175,55,.2);
}

.booking-label{
  display:block;
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.booking-code{
  display:block;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
  color:#222;
  margin-bottom:12px;
  word-break:break-word;
}

.copy-button{
  width:auto;
  margin:0;
  padding:9px 18px;
  background:#d4af37;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.copy-button:active{
  transform:scale(.97);
}

.check-status{
  display:block;
  margin-top:10px;
  color:#666;
  font-size:13px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.submit{
  width:100%;
  margin-top:22px;
  padding:14px;
  background:#d4af37;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#message{
  margin-top:18px;
  text-align:center;
  font-weight:bold;
  line-height:1.5;
}

.error-box{
  background:#fff0f0;
  border:1px solid #e53935;
  color:#b71c1c;
  padding:14px;
  border-radius:10px;
  text-align:left;
}

.success-box{
  background:#f0fff4;
  border:1px solid #43a047;
  color:#1b5e20;
  padding:14px;
  border-radius:10px;
  text-align:center;
}

.checking-box{
  background:#fffaf0;
  border:1px solid #d4af37;
  color:#6d5700;
  padding:14px;
  border-radius:10px;
}

.success-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:20px;
}

.action-button{
  display:block;
  width:100%;
  padding:13px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}

.status-button{
  background:#d4af37;
  color:white;
}

.home-button{
  background:#111;
  color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>
💳 Payment
</h1>

<div
  id="bookingBox"
  class="booking-box"
>

<span class="booking-label">
Reservation ID
</span>

<span
  id="bookingCode"
  class="booking-code"
>
Loading...
</span>

<button
  id="copyButton"
  class="copy-button"
  onclick="copyBookingCode()"
>
📋 Copy
</button>

<span class="check-status">
📋 Copy this to check your reservation status
</span>

</div>

<label for="receiptUrl">
Payment Receipt URL
</label>

<input
  id="receiptUrl"
  type="url"
  placeholder="Paste your receipt link here"
  autocomplete="off"
>

<button
  id="submitButton"
  class="submit"
  onclick="submitPayment()"
>
Submit Payment
</button>

<div id="message"></div>

</div>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="config.js"></script>

<script>

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params =
new URLSearchParams(
  window.location.search
);

const reservationCode =
(params.get("reservation") || "").trim();

let reservation = null;

function showError(text){

document.getElementById(
  "message"
).innerHTML = `

<div class="error-box">

❌ ${escapeHtml(text)}

</div>

`;

}

async function loadReservation(){

const bookingCode =
document.getElementById(
  "bookingCode"
);

const submitButton =
document.getElementById(
  "submitButton"
);

if(!reservationCode){

bookingCode.textContent =
"Missing ID";

showError(
"No reservation was provided."
);

submitButton.disabled=true;

return;

}

bookingCode.textContent =
reservationCode;

const {
data,
error
} =
await supabaseClient

.from("reservations")

.select(
  "id,reservation_code,customer_id,room_id,check_in,check_out,total_amount,status"
)

.eq(
  "reservation_code",
  reservationCode
)

.maybeSingle();

if(error){

console.error(
"Reservation lookup error:",
error
);

showError(
"Could not load the reservation. " +
(
  error.message ||
  "Please try again."
)
);

submitButton.disabled=true;

return;

}

if(!data){

console.error(
"No reservation returned for:",
reservationCode
);

showError(
"Reservation not found. Please check the reservation ID."
);

submitButton.disabled=true;

return;

}

reservation=data;

if(
reservation.status === "cancelled"
){

showError(
"This reservation has been cancelled and cannot receive payment."
);

submitButton.disabled=true;

return;

}

if(
reservation.status === "confirmed"
){

showError(
"This reservation is already confirmed."
);

submitButton.disabled=true;

return;

}

document.getElementById(
"message"
).innerHTML="";

}

function copyBookingCode(){

if(!reservationCode){
return;
}

if(
navigator.clipboard &&
navigator.clipboard.writeText
){

navigator.clipboard
.writeText(reservationCode)
.then(()=>{

const button =
document.getElementById(
  "copyButton"
);

button.textContent =
"✅ Copied!";

setTimeout(()=>{

button.textContent =
"📋 Copy";

},1500);

})
.catch(()=>{

alert(
"Could not copy automatically. Please copy the reservation ID manually."
);

});

return;

}

alert(
"Please copy the reservation ID manually: " +
reservationCode
);

}

async function submitPayment(){

const receiptUrl =
document.getElementById(
"receiptUrl"
).value.trim();

const message =
document.getElementById(
"message"
);

const button =
document.getElementById(
"submitButton"
);

if(!receiptUrl){

message.innerHTML = `

<div class="error-box">

❌ Please enter your receipt URL.

</div>

`;

return;

}

try{

new URL(receiptUrl);

}
catch{

message.innerHTML = `

<div class="error-box">

❌ Please enter a valid receipt URL.

</div>

`;

return;

}

if(!reservation){

message.innerHTML = `

<div class="error-box">

❌ Reservation information is not available.

</div>

`;

return;

}

button.disabled=true;

message.innerHTML = `

<div class="checking-box">

Submitting payment...

</div>

`;

const {
data:existingPayments,
error:existingPaymentError
} =
await supabaseClient

.from("payments")

.select("id,status")

.eq(
"reservation_id",
reservation.id
)

.limit(1);

if(existingPaymentError){

console.error(
"Existing payment check error:",
existingPaymentError
);

message.innerHTML = `

<div class="error-box">

❌ Could not verify the payment status.

<br><br>

${escapeHtml(
existingPaymentError.message ||
"Database error."
)}

</div>

`;

button.disabled=false;

return;

}

if(
existingPayments &&
existingPayments.length > 0
){

message.innerHTML = `

<div class="error-box">

❌ A payment receipt has already been submitted for this reservation.

<br><br>

Please wait for the hotel to review it.

<div class="success-actions">

<a
class="action-button status-button"
href="check-status.html?reservation=${encodeURIComponent(
reservationCode
)}"
>
🔎 Check Reservation Status
</a>

<a
class="action-button home-button"
href="index.html"
>
🏠 Back to Home
</a>

</div>

</div>

`;

button.style.display="none";

return;

}

const {
data:payment,
error:paymentError
} =
await supabaseClient

.from("payments")

.insert({

reservation_id:
reservation.id,

amount:
reservation.total_amount,

receipt_url:
receiptUrl,

status:
"pending"

})

.select(
"id,reservation_id,amount,receipt_url,status"
)

.single();

if(paymentError){

console.error(
"Payment submission error:",
paymentError
);

message.innerHTML = `

<div class="error-box">

❌ <strong>
Could not submit payment.
</strong>

<br><br>

${escapeHtml(
paymentError.message ||
"Unknown database error."
)}

${
paymentError.details
?
`
<br><br>
${escapeHtml(paymentError.details)}
`
:
""
}

</div>

`;

button.disabled=false;

return;

}

if(!payment){

message.innerHTML = `

<div class="error-box">

❌ Payment could not be confirmed.

<br><br>

Please try again.

</div>

`;

button.disabled=false;

return;

}

message.innerHTML = `

<div class="success-box">

<strong>
✅ Payment receipt submitted!
</strong>

<p>
Your payment receipt has been received successfully.
</p>

<p>
⏳ <strong>
Please allow 10–30 minutes
</strong>
for the hotel to review your payment and update your reservation status.
</p>

<div class="success-actions">

<a
class="action-button status-button"
href="check-status.html?reservation=${encodeURIComponent(
reservationCode
)}"
>
🔎 Check Reservation Status
</a>

<a
class="action-button home-button"
href="index.html"
>
🏠 Back to Home
</a>

</div>

</div>

`;

document.getElementById(
"receiptUrl"
).disabled=true;

button.style.display="none";

}

function escapeHtml(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

loadReservation();

</script>

</body>

</html>
