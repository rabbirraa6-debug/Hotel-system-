<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Reserve Room</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .room-info {
      background: #f1eee6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .error-box {
      background: #fff0f0;
      border: 1px solid #e53935;
      color: #b71c1c;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .success-box {
      background: #f0fff4;
      border: 1px solid #43a047;
      color: #1b5e20;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style></head><body>  <div class="container"><h1>
  Reserve Your Room
</h1>

<div
  id="roomInfo"
  class="room-info"
>
  Loading room...
</div>

<label for="name">
  Your Name
</label>

<input
  id="name"
  type="text"
  placeholder="Enter your name"
  autocomplete="name"
>

<label for="phone">
  Phone Number
</label>

<input
  id="phone"
  type="tel"
  placeholder="Enter your phone number"
  autocomplete="tel"
>

<label for="checkIn">
  Check-in
</label>

<input
  id="checkIn"
  type="date"
>

<label for="checkOut">
  Check-out
</label>

<input
  id="checkOut"
  type="date"
>

<div class="total">

  Total:

  <span id="total">
    0
  </span>

  ETB

</div>

<button
  id="reserveButton"
  onclick="makeReservation()"
>
  Confirm Reservation
</button>

<div id="message"></div>

  </div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="config.js"></script>  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const params =
      new URLSearchParams(
        window.location.search
      );

    const roomId =
      params.get("room");

    let selectedRoom = null;


    /*
     * LOAD ROOM
     */

    async function loadRoom() {

      if (!roomId) {

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ No room selected.";

        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("rooms")
          .select("*")
          .eq(
            "id",
            roomId
          )
          .single();

      if (error) {

        console.error(error);

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ Could not load room.";

        return;
      }

      selectedRoom = data;

      document.getElementById(
        "roomInfo"
      ).innerHTML = `

        <h2>
          ${escapeHtml(data.name)}
        </h2>

        <p>
          Room ${escapeHtml(data.room_number)}
        </p>

        <p>
          ${escapeHtml(data.description || "")}
        </p>

        <p>
          👥 ${data.capacity} guests
        </p>

        <strong>
          ${Number(data.price).toFixed(2)} ETB / night
        </strong>

      `;
    }


    /*
     * CALCULATE TOTAL
     */

    function calculateTotal() {

      if (!selectedRoom) {
        return;
      }

      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;

      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;

      if (
        !checkIn ||
        !checkOut
      ) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;
      }

      const start =
        new Date(
          checkIn + "T00:00:00"
        );

      const end =
        new Date(
          checkOut + "T00:00:00"
        );

      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );

      if (nights <= 0) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;
      }

      const total =
        nights *
        Number(
          selectedRoom.price
        );

      document.getElementById(
        "total"
      ).textContent =
        total.toFixed(2);
    }


    /*
     * CHECK WHETHER ERROR IS
     * A DOUBLE-BOOKING ERROR
     */

    function isRoomOverlapError(error) {

      if (!error) {
        return false;
      }

      const text =
        (
          (error.message || "") +
          " " +
          (error.details || "") +
          " " +
          (error.hint || "")
        ).toLowerCase();

      return (
        error.code === "23P01" ||
        text.includes(
          "reservations_no_room_overlap"
        ) ||
        text.includes(
          "exclusion constraint"
        ) ||
        text.includes(
          "conflicting key value"
        )
      );
    }


    /*
     * MAKE RESERVATION
     */

    async function makeReservation() {

      const name =
        document.getElementById(
          "name"
        ).value.trim();

      const phone =
        document.getElementById(
          "phone"
        ).value.trim();

      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;

      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;

      const message =
        document.getElementById(
          "message"
        );

      const button =
        document.getElementById(
          "reserveButton"
        );


      message.innerHTML = "";


      /*
       * BASIC VALIDATION
       */

      if (
        !name ||
        !phone ||
        !checkIn ||
        !checkOut
      ) {

        message.innerHTML = `
          <div class="error-box">
            ❌ Please fill in all fields.
          </div>
        `;

        return;
      }


      if (!selectedRoom) {

        message.innerHTML = `
          <div class="error-box">
            ❌ Room information is not available.
          </div>
        `;

        return;
      }


      /*
       * DATE VALIDATION
       */

      const start =
        new Date(
          checkIn + "T00:00:00"
        );

      const end =
        new Date(
          checkOut + "T00:00:00"
        );


      if (
        Number.isNaN(start.getTime()) ||
        Number.isNaN(end.getTime())
      ) {

        message.innerHTML = `
          <div class="error-box">
            ❌ Please enter valid check-in and check-out dates.
          </div>
        `;

        return;
      }


      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (nights <= 0) {

        message.innerHTML = `
          <div class="error-box">
            ❌ Check-out must be after check-in.
          </div>
        `;

        return;
      }


      const total =
        nights *
        Number(
          selectedRoom.price
        );


      /*
       * GENERATE RESERVATION CODE
       */

      const reservationCode =
        "HTL-" +
        Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();


      button.disabled = true;

      button.textContent =
        "Creating reservation...";


      message.innerHTML = `
        Creating reservation...
      `;


      /*
       * CREATE CUSTOMER
       */

      const {
        data: customer,
        error: customerError
      } =
        await supabaseClient
          .from("customers")
          .insert({

            name: name,

            phone: phone

          })
          .select()
          .single();


      if (customerError) {

        console.error(
          customerError
        );

        message.innerHTML = `
          <div class="error-box">
            ❌ Could not create customer.
            <br>
            Please try again.
          </div>
        `;

        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;
      }


      /*
       * CREATE RESERVATION
       *
       * IMPORTANT:
       * The database exclusion constraint
       * is the final protection against
       * double booking.
       */

      const {
        data: reservation,
        error: reservationError
      } =
        await supabaseClient
          .from("reservations")
          .insert({

            reservation_code:
              reservationCode,

            customer_id:
              customer.id,

            room_id:
              selectedRoom.id,

            check_in:
              checkIn,

            check_out:
              checkOut,

            total_amount:
              total,

            status:
              "pending"

          })
          .select()
          .single();


      /*
       * HANDLE RESERVATION ERROR
       */

      if (reservationError) {

        console.error(
          "Reservation error:",
          reservationError
        );


        /*
         * DOUBLE BOOKING
         */

        if (
          isRoomOverlapError(
            reservationError
          )
        ) {

          message.innerHTML = `
            <div class="error-box">

              ❌ <strong>
                Room already reserved
              </strong>

              <br><br>

              This room is already reserved
              for some or all of the dates
              you selected.

              <br><br>

              Please choose different dates
              or select another room.

            </div>
          `;

        }


        /*
         * OTHER DATABASE ERROR
         */

        else {

          message.innerHTML = `
            <div class="error-box">

              ❌ <strong>
                Could not create reservation.
              </strong>

              <br><br>

              Please check your information
              and try again.

            </div>
          `;

        }


        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;
      }


      /*
       * SUCCESS
       */

      message.innerHTML = `

        <div class="success-box">

          <strong>
            ✅ Reservation created!
          </strong>

          <p>
            Reservation ID:
            <br>
            <strong>
              ${escapeHtml(
                reservation.reservation_code
              )}
            </strong>
          </p>

          <p>
            Redirecting to payment...
          </p>

        </div>

      `;


      button.style.display =
        "none";


      /*
       * REDIRECT TO PAYMENT
       */

      setTimeout(() => {

        window.location.href =
          "payment.html?reservation=" +
          encodeURIComponent(
            reservation.reservation_code
          );

      }, 1500);

    }


    /*
     * SIMPLE HTML ESCAPE
     */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /*
     * DATE EVENTS
     */

    document
      .getElementById(
        "checkIn"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    document
      .getElementById(
        "checkOut"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    /*
     * LOAD ROOM
     */

    loadRoom();

  </script></body></html>
