<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Reserve Room</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f5f0;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.room-info {
  background: #f1eee6;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.total {
  margin-top: 20px;
  padding: 15px;
  background: #111;
  color: white;
  border-radius: 10px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #d4af37;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

.success {
  color: #16833b;
}

.error {
  color: #c62828;
}

.warning {
  color: #b77900;
}

</style>

</head>


<body>


<div class="container">

<h1>
Reserve Your Room
</h1>


<div
  id="roomInfo"
  class="room-info"
>
Loading room...
</div>


<label>
Your Name
</label>

<input
  id="name"
  type="text"
  placeholder="Enter your name"
>


<label>
Phone Number
</label>

<input
  id="phone"
  type="tel"
  placeholder="Enter your phone number"
>


<label>
Check-in
</label>

<input
  id="checkIn"
  type="date"
>


<label>
Check-out
</label>

<input
  id="checkOut"
  type="date"
>


<div class="total">

Total:

<span id="total">
0
</span>

ETB

</div>


<button
  id="reserveButton"
  onclick="makeReservation()"
>
Confirm Reservation
</button>


<div id="message"></div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const roomId =
  params.get("room");


let selectedRoom = null;



/* ================================
   LOAD ROOM
================================ */

async function loadRoom() {

  const roomInfo =
    document.getElementById("roomInfo");


  if (!roomId) {

    roomInfo.innerHTML =
      `<span class="error">
        ❌ No room selected.
      </span>`;

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("rooms")
      .select("*")
      .eq("id", roomId)
      .single();


  if (error || !data) {

    console.error(error);

    roomInfo.innerHTML =
      `<span class="error">
        ❌ Could not load room.
      </span>`;

    return;

  }


  selectedRoom = data;


  roomInfo.innerHTML = `

    <h2>
      ${escapeHtml(data.name)}
    </h2>

    <p>
      Room ${escapeHtml(data.room_number)}
    </p>

    <p>
      ${escapeHtml(data.description || "")}
    </p>

    <p>
      👥 ${data.capacity} guests
    </p>

    <strong>
      ${Number(data.price).toFixed(2)} ETB / night
    </strong>

  `;

}



/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}



/* ================================
   GET TODAY
================================ */

function getTodayString() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;

}



/* ================================
   SET MINIMUM DATE
================================ */

function setDateLimits() {

  const today =
    getTodayString();


  document
    .getElementById("checkIn")
    .min = today;


  document
    .getElementById("checkOut")
    .min = today;

}



/* ================================
   CALCULATE TOTAL
================================ */

function calculateTotal() {

  if (!selectedRoom) {
    return;
  }


  const checkIn =
    document
      .getElementById("checkIn")
      .value;


  const checkOut =
    document
      .getElementById("checkOut")
      .value;


  const totalElement =
    document
      .getElementById("total");


  if (!checkIn || !checkOut) {

    totalElement.textContent =
      "0";

    return;

  }


  const start =
    new Date(
      checkIn + "T00:00:00"
    );


  const end =
    new Date(
      checkOut + "T00:00:00"
    );


  const milliseconds =
    end.getTime() -
    start.getTime();


  const nights =
    Math.ceil(
      milliseconds /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  if (nights <= 0) {

    totalElement.textContent =
      "0";

    return;

  }


  const total =
    nights *
    Number(
      selectedRoom.price
    );


  totalElement.textContent =
    total.toFixed(2);

}



/* ================================
   CHECK ROOM AVAILABILITY
================================ */

async function checkRoomAvailability(
  checkIn,
  checkOut
) {

  /*
    We check:

    check_in < existing check_out
    AND
    check_out > existing check_in

    This detects overlapping dates.
  */


  const {
    data,
    error
  } =
    await supabaseClient
      .from("reservations")
      .select(`
        id,
        reservation_code,
        room_id,
        check_in,
        check_out,
        status
      `)
      .eq(
        "room_id",
        selectedRoom.id
      )
      .in(
        "status",
        [
          "pending",
          "confirmed"
        ]
      )
      .lt(
        "check_in",
        checkOut
      )
      .gt(
        "check_out",
        checkIn
      );


  if (error) {

    console.error(
      "Availability check error:",
      error
    );

    return {
      error: error
    };

  }


  return {
    error: null,
    available:
      !data ||
      data.length === 0,
    reservations:
      data || []
  };

}



/* ================================
   MAKE RESERVATION
================================ */

async function makeReservation() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const checkIn =
    document
      .getElementById("checkIn")
      .value;


  const checkOut =
    document
      .getElementById("checkOut")
      .value;


  const message =
    document
      .getElementById("message");


  const button =
    document
      .getElementById("reserveButton");


  message.className = "";


  /* ================================
     BASIC VALIDATION
  ================================ */

  if (!selectedRoom) {

    message.className =
      "error";

    message.textContent =
      "❌ Room information is not available.";

    return;

  }


  if (
    !name ||
    !phone ||
    !checkIn ||
    !checkOut
  ) {

    message.className =
      "error";

    message.textContent =
      "❌ Please fill in all fields.";

    return;

  }


  const start =
    new Date(
      checkIn + "T00:00:00"
    );


  const end =
    new Date(
      checkOut + "T00:00:00"
    );


  const today =
    new Date(
      getTodayString() +
      "T00:00:00"
    );


  /* ================================
     CHECK-IN NOT IN PAST
  ================================ */

  if (start < today) {

    message.className =
      "error";

    message.textContent =
      "❌ Check-in date cannot be in the past.";

    return;

  }


  /* ================================
     CHECK-OUT AFTER CHECK-IN
  ================================ */

  if (end <= start) {

    message.className =
      "error";

    message.textContent =
      "❌ Check-out must be after check-in.";

    return;

  }


  const milliseconds =
    end.getTime() -
    start.getTime();


  const nights =
    Math.ceil(
      milliseconds /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  if (nights <= 0) {

    message.className =
      "error";

    message.textContent =
      "❌ Invalid reservation dates.";

    return;

  }


  const total =
    nights *
    Number(
      selectedRoom.price
    );


  /* ================================
     DISABLE BUTTON
  ================================ */

  button.disabled = true;

  button.textContent =
    "Checking availability...";


  message.textContent =
    "";



  /* ================================
     CHECK AVAILABILITY
  ================================ */

  const availability =
    await checkRoomAvailability(
      checkIn,
      checkOut
    );


  if (availability.error) {

    console.error(
      availability.error
    );

    message.className =
      "error";

    message.textContent =
      "❌ Could not check room availability. Please try again.";

    button.disabled = false;

    button.textContent =
      "Confirm Reservation";

    return;

  }


  if (!availability.available) {

    console.log(
      "Overlapping reservations:",
      availability.reservations
    );


    message.className =
      "error";

    message.innerHTML = `

      ❌ <strong>
        This room is already reserved
      </strong>

      <p>
        The selected room is not available
        for these dates.
      </p>

      <p>
        Please choose different dates
        or another room.
      </p>

    `;


    button.disabled = false;

    button.textContent =
      "Confirm Reservation";

    return;

  }



  /* ================================
     CREATE RESERVATION CODE
  ================================ */

  const reservationCode =
    "HTL-" +
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();



  /* ================================
     CREATE CUSTOMER
  ================================ */

  button.textContent =
    "Creating reservation...";


  const {
    data: customer,
    error: customerError
  } =
    await supabaseClient
      .from("customers")
      .insert({

        name: name,

        phone: phone

      })
      .select()
      .single();


  if (customerError) {

    console.error(
      "Customer error:",
      customerError
    );


    message.className =
      "error";

    message.textContent =
      "❌ Could not create customer information.";

    button.disabled = false;

    button.textContent =
      "Confirm Reservation";

    return;

  }



  /* ================================
     CREATE RESERVATION
  ================================ */

  button.textContent =
    "Creating reservation...";


  const {
    data: reservation,
    error: reservationError
  } =
    await supabaseClient
      .from("reservations")
      .insert({

        reservation_code:
          reservationCode,

        customer_id:
          customer.id,

        room_id:
          selectedRoom.id,

        check_in:
          checkIn,

        check_out:
          checkOut,

        total_amount:
          total,

        status:
          "pending"

      })
      .select()
      .single();



  /* ================================
     DATABASE DOUBLE-BOOKING PROTECTION
  ================================ */

  if (reservationError) {

    console.error(
      "Reservation error:",
      reservationError
    );


    /*
      PostgreSQL exclusion constraint:

      reservations_no_room_overlap

      Error code:

      23P01

      This can happen if another customer
      booked the room between our
      availability check and our INSERT.
    */


    if (
      reservationError.code ===
      "23P01"
    ) {

      message.className =
        "error";

      message.innerHTML = `

        ❌ <strong>
          Room is no longer available
        </strong>

        <p>
          Another customer reserved
          this room at the same time.
        </p>

        <p>
          Please choose another date
          or another room.
        </p>

      `;

    } else {

      message.className =
        "error";

      message.innerHTML = `

        ❌ <strong>
          Could not create reservation.
        </strong>

        <p>
          Please try again.
        </p>

      `;

    }


    button.disabled = false;

    button.textContent =
      "Confirm Reservation";

    return;

  }



  /* ================================
     SUCCESS
  ================================ */

  message.className =
    "success";


  message.innerHTML = `

    <strong>
      ✅ Reservation created!
    </strong>

    <p>
      Reservation ID:
      <strong>
        ${escapeHtml(
          reservation.reservation_code
        )}
      </strong>
    </p>

    <p>
      Total:
      <strong>
        ${total.toFixed(2)} ETB
      </strong>
    </p>

    <p>
      Redirecting to payment...
    </p>

  `;


  button.style.display =
    "none";


  setTimeout(() => {

    window.location.href =
      "payment.html?reservation=" +
      encodeURIComponent(
        reservation.reservation_code
      );

  }, 1500);

}



/* ================================
   DATE EVENTS
================================ */

document
  .getElementById("checkIn")
  .addEventListener(
    "change",
    function() {

      const checkOut =
        document
          .getElementById("checkOut");


      checkOut.min =
        this.value;


      /*
        If current checkout is
        before/equal to check-in,
        clear it.
      */

      if (
        checkOut.value &&
        checkOut.value <= this.value
      ) {

        checkOut.value = "";

      }


      calculateTotal();

    }
  );


document
  .getElementById("checkOut")
  .addEventListener(
    "change",
    calculateTotal
  );



/* ================================
   START
================================ */

setDateLimits();

loadRoom();

</script>

</body>

</html>
