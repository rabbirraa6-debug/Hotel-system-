<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reserve Room</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .room-info {
      background: #f1eee6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>


<body>


  <div class="container">

    <h1>
      Reserve Your Room
    </h1>


    <div
      id="roomInfo"
      class="room-info"
    >
      Loading room...
    </div>


    <label>
      Your Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
    >


    <label>
      Phone Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="Enter your phone number"
    >


    <label>
      Check-in
    </label>

    <input
      id="checkIn"
      type="date"
    >


    <label>
      Check-out
    </label>

    <input
      id="checkOut"
      type="date"
    >


    <div class="total">

      Total:

      <span id="total">
        0
      </span>

      ETB

    </div>


    <button
      id="reserveButton"
      onclick="makeReservation()"
    >
      Confirm Reservation
    </button>


    <div id="message"></div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const roomId =
      params.get("room");


    let selectedRoom = null;


    async function loadRoom() {

      if (!roomId) {

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ No room selected.";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("rooms")
          .select("*")
          .eq(
            "id",
            roomId
          )
          .single();


      if (error) {

        console.error(error);

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ Could not load room.";

        return;

      }


      selectedRoom = data;


      document.getElementById(
        "roomInfo"
      ).innerHTML = `

        <h2>
          ${data.name}
        </h2>

        <p>
          Room ${data.room_number}
        </p>

        <p>
          ${data.description || ""}
        </p>

        <p>
          👥 ${data.capacity} guests
        </p>

        <strong>
          ${data.price} ETB / night
        </strong>

      `;

    }


    function calculateTotal() {

      if (!selectedRoom) {
        return;
      }


      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;


      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;


      if (
        !checkIn ||
        !checkOut
      ) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;

      }


      const start =
        new Date(checkIn);


      const end =
        new Date(checkOut);


      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (nights <= 0) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;

      }


      const total =
        nights *
        Number(
          selectedRoom.price
        );


      document.getElementById(
        "total"
      ).textContent =
        total.toFixed(2);

    }


    async function makeReservation() {

      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;


      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;


      const message =
        document.getElementById(
          "message"
        );


      const button =
        document.getElementById(
          "reserveButton"
        );


      message.textContent = "";


      if (!selectedRoom) {

        message.textContent =
          "❌ Room information is not available.";

        return;

      }


      if (
        !name ||
        !phone ||
        !checkIn ||
        !checkOut
      ) {

        message.textContent =
          "❌ Please fill in all fields.";

        return;

      }


      const start =
        new Date(checkIn);


      const end =
        new Date(checkOut);


      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (nights <= 0) {

        message.textContent =
          "❌ Check-out must be after check-in.";

        return;

      }


      const total =
        nights *
        Number(
          selectedRoom.price
        );


      button.disabled = true;

      button.textContent =
        "Checking availability...";

      message.textContent =
        "🔎 Checking room availability...";


      /*
        ------------------------------------------------
        FIRST CHECK
        ------------------------------------------------

        Check whether this room already has a
        pending or confirmed reservation that
        overlaps the requested dates.

        Overlap rule:

        existing.check_in < new.check_out
        AND
        existing.check_out > new.check_in
      */

      const {
        data: conflictingReservations,
        error: availabilityError
      } =
        await supabaseClient
          .from("reservations")
          .select(`
            id,
            reservation_code,
            check_in,
            check_out,
            status
          `)
          .eq(
            "room_id",
            selectedRoom.id
          )
          .in(
            "status",
            [
              "pending",
              "confirmed"
            ]
          )
          .lt(
            "check_in",
            checkOut
          )
          .gt(
            "check_out",
            checkIn
          )
          .limit(1);


      if (availabilityError) {

        console.error(
          availabilityError
        );

        message.textContent =
          "❌ Could not check room availability.";

        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;

      }


      /*
        ------------------------------------------------
        ROOM ALREADY OCCUPIED
        ------------------------------------------------
      */

      if (
        conflictingReservations &&
        conflictingReservations.length > 0
      ) {

        message.innerHTML = `

          <div
            style="
              background:#fff0f0;
              border:1px solid #c62828;
              color:#b71c1c;
              padding:15px;
              border-radius:10px;
              margin-top:10px;
            "
          >

            <strong>
              ❌ Room not available
            </strong>

            <p
              style="
                margin:8px 0 0;
                font-weight:normal;
              "
            >
              This room is already reserved
              for part or all of your selected
              dates.
            </p>

            <p
              style="
                margin:8px 0 0;
                font-weight:normal;
              "
            >
              Please choose different dates
              or another room.
            </p>

          </div>

        `;

        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;

      }


      /*
        ------------------------------------------------
        CREATE CUSTOMER
        ------------------------------------------------
      */

      button.textContent =
        "Creating reservation...";

      message.textContent =
        "Creating your reservation...";


      const reservationCode =
        "HTL-" +
        Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();


      const {
        data: customer,
        error: customerError
      } =
        await supabaseClient
          .from("customers")
          .insert({

            name:
              name,

            phone:
              phone

          })
          .select()
          .single();


      if (customerError) {

        console.error(
          customerError
        );

        message.textContent =
          "❌ Could not create customer.";

        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;

      }


      /*
        ------------------------------------------------
        CREATE RESERVATION
        ------------------------------------------------

        The database exclusion constraint is the
        FINAL protection.

        Even if another customer books the room
        between our availability check and this
        INSERT, PostgreSQL will reject this INSERT
        with error code 23P01.
      */

      const {
        data: reservation,
        error: reservationError
      } =
        await supabaseClient
          .from("reservations")
          .insert({

            reservation_code:
              reservationCode,

            customer_id:
              customer.id,

            room_id:
              selectedRoom.id,

            check_in:
              checkIn,

            check_out:
              checkOut,

            total_amount:
              total,

            status:
              "pending"

          })
          .select()
          .single();


      /*
        ------------------------------------------------
        HANDLE DATABASE DOUBLE-BOOKING ERROR
        ------------------------------------------------
      */

      if (reservationError) {

        console.error(
          "Reservation error:",
          reservationError
        );


        /*
          PostgreSQL exclusion constraint error.

          23P01 =
          exclusion_violation
        */

        if (
          reservationError.code ===
          "23P01"
        ) {

          message.innerHTML = `

            <div
              style="
                background:#fff0f0;
                border:1px solid #c62828;
                color:#b71c1c;
                padding:15px;
                border-radius:10px;
                margin-top:10px;
              "
            >

              <strong>
                ❌ Room no longer available
              </strong>

              <p
                style="
                  margin:8px 0 0;
                  font-weight:normal;
                "
              >
                Another customer has reserved
                this room for dates that overlap
                with your selection.
              </p>

              <p
                style="
                  margin:8px 0 0;
                  font-weight:normal;
                "
              >
                Please choose different dates
                or another room.
              </p>

            </div>

          `;

          button.disabled = false;

          button.textContent =
            "Confirm Reservation";

          return;

        }


        /*
          Handle other reservation errors.
        */

        message.textContent =
          "❌ Could not create reservation.";

        button.disabled = false;

        button.textContent =
          "Confirm Reservation";

        return;

      }


      /*
        ------------------------------------------------
        SUCCESS
        ------------------------------------------------
      */

      message.innerHTML = `

        <div
          style="
            background:#f3fff5;
            border:1px solid #55b875;
            color:#16833b;
            padding:15px;
            border-radius:10px;
          "
        >

          <strong>
            ✅ Reservation created!
          </strong>

          <p
            style="
              margin:8px 0;
              font-weight:normal;
            "
          >
            Reservation ID:
            <strong>
              ${reservation.reservation_code}
            </strong>
          </p>

          <p
            style="
              margin:8px 0 0;
              font-weight:normal;
            "
          >
            Redirecting to payment...
          </p>

        </div>

      `;


      button.textContent =
        "Reservation Created";


      setTimeout(() => {

        window.location.href =
          "payment.html?reservation=" +
          encodeURIComponent(
            reservation.reservation_code
          );

      }, 1500);

    }


    /*
      ------------------------------------------------
      RECALCULATE TOTAL WHEN DATES CHANGE
      ------------------------------------------------
    */

    document
      .getElementById(
        "checkIn"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    document
      .getElementById(
        "checkOut"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    /*
      ------------------------------------------------
      LOAD ROOM
      ------------------------------------------------
    */

    loadRoom();

  </script>

</body>

</html>
