<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reserve Room</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .room-info {
      background: #f1eee6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }


    /* =========================
       BOOKING CODE
       ========================= */

    .reservation-success {
      text-align: center;
      margin-top: 20px;
    }

    .booking-code-box {
      margin: 18px auto 8px;
      padding: 16px 20px;
      max-width: 300px;

      border: 2px solid #d4af37;
      border-radius: 14px;

      background: #fffdf5;

      box-shadow:
        0 0 8px rgba(212, 175, 55, 0.45),
        0 0 22px rgba(212, 175, 55, 0.18);
    }

    .booking-code {
      display: block;

      font-size: 25px;
      font-weight: bold;

      letter-spacing: 2px;

      color: #222;

      margin-bottom: 10px;
    }

    .copy-code {
      width: auto;

      margin-top: 0;

      padding: 9px 18px;

      background: #d4af37;
      color: white;

      border-radius: 8px;

      font-weight: bold;
      cursor: pointer;
    }

    .copy-code:active {
      transform: scale(0.97);
    }

    .check-status-text {
      display: block;

      margin-top: 10px;

      color: #666;

      font-size: 14px;
    }

  </style>

</head>


<body>


  <div class="container">

    <h1>
      Reserve Your Room
    </h1>


    <!-- ROOM INFORMATION -->

    <div
      id="roomInfo"
      class="room-info"
    >
      Loading room...
    </div>


    <!-- CUSTOMER NAME -->

    <label>
      Your Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
    >


    <!-- PHONE -->

    <label>
      Phone Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="Enter your phone number"
    >


    <!-- CHECK IN -->

    <label>
      Check-in
    </label>

    <input
      id="checkIn"
      type="date"
    >


    <!-- CHECK OUT -->

    <label>
      Check-out
    </label>

    <input
      id="checkOut"
      type="date"
    >


    <!-- TOTAL -->

    <div class="total">

      Total:

      <span id="total">
        0
      </span>

      ETB

    </div>


    <!-- RESERVE -->

    <button
      id="reserveButton"
      onclick="makeReservation()"
    >
      Confirm Reservation
    </button>


    <!-- MESSAGE -->

    <div id="message"></div>

  </div>



  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    // =========================
    // SUPABASE
    // =========================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // GET ROOM ID
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const roomId =
      params.get("room");


    let selectedRoom = null;


    // =========================
    // LOAD ROOM
    // =========================

    async function loadRoom() {

      if (!roomId) {

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ No room selected.";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("rooms")
          .select("*")
          .eq(
            "id",
            roomId
          )
          .single();


      if (error) {

        console.error(error);

        document.getElementById(
          "roomInfo"
        ).innerHTML =
          "❌ Could not load room.";

        return;

      }


      selectedRoom = data;


      document.getElementById(
        "roomInfo"
      ).innerHTML = `

        <h2>
          ${data.name}
        </h2>

        <p>
          Room ${data.room_number}
        </p>

        <p>
          ${data.description || ""}
        </p>

        <p>
          👥 ${data.capacity} guests
        </p>

        <strong>
          ${data.price} ETB / night
        </strong>

      `;

    }


    // =========================
    // CALCULATE TOTAL
    // =========================

    function calculateTotal() {

      if (!selectedRoom) {
        return;
      }


      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;


      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;


      if (
        !checkIn ||
        !checkOut
      ) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;

      }


      const start =
        new Date(checkIn);


      const end =
        new Date(checkOut);


      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (nights <= 0) {

        document.getElementById(
          "total"
        ).textContent =
          "0";

        return;

      }


      const total =
        nights *
        Number(
          selectedRoom.price
        );


      document.getElementById(
        "total"
      ).textContent =
        total.toFixed(2);

    }


    // =========================
    // CREATE RESERVATION
    // =========================

    async function makeReservation() {

      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      const checkIn =
        document.getElementById(
          "checkIn"
        ).value;


      const checkOut =
        document.getElementById(
          "checkOut"
        ).value;


      const message =
        document.getElementById(
          "message"
        );


      const button =
        document.getElementById(
          "reserveButton"
        );


      // =========================
      // VALIDATION
      // =========================

      if (
        !name ||
        !phone ||
        !checkIn ||
        !checkOut
      ) {

        message.textContent =
          "❌ Please fill in all fields.";

        return;

      }


      const start =
        new Date(checkIn);


      const end =
        new Date(checkOut);


      const nights =
        Math.ceil(
          (
            end - start
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );


      if (nights <= 0) {

        message.textContent =
          "❌ Check-out must be after check-in.";

        return;

      }


      const total =
        nights *
        Number(
          selectedRoom.price
        );


      // =========================
      // RESERVATION CODE
      // =========================

      const reservationCode =
        "HTL-" +
        Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();


      button.disabled = true;


      message.textContent =
        "Creating reservation...";


      // =========================
      // CREATE CUSTOMER
      // =========================

      const {
        data: customer,
        error: customerError
      } =
        await supabaseClient
          .from("customers")
          .insert({

            name: name,

            phone: phone

          })
          .select()
          .single();


      if (customerError) {

        console.error(
          customerError
        );

        message.textContent =
          "❌ Could not create customer.";

        button.disabled = false;

        return;

      }


      // =========================
      // CREATE RESERVATION
      // =========================

      const {
        data: reservation,
        error: reservationError
      } =
        await supabaseClient
          .from("reservations")
          .insert({

            reservation_code:
              reservationCode,

            customer_id:
              customer.id,

            room_id:
              selectedRoom.id,

            check_in:
              checkIn,

            check_out:
              checkOut,

            total_amount:
              total,

            status:
              "pending"

          })
          .select()
          .single();


      if (reservationError) {

        console.error(
          reservationError
        );

        message.textContent =
          "❌ Could not create reservation.";

        button.disabled = false;

        return;

      }


      // =========================
      // SUCCESS SCREEN
      // =========================

      message.innerHTML = `

        <div class="reservation-success">

          <strong>
            ✅ Reservation created!
          </strong>

          <p>
            Your reservation ID is:
          </p>


          <div class="booking-code-box">

            <span
              id="bookingCode"
              class="booking-code"
            >
              ${reservation.reservation_code}
            </span>


            <button
              class="copy-code"
              onclick="copyBookingCode()"
            >
              📋 Copy
            </button>

          </div>


          <span class="check-status-text">

            📋 Copy this to check
            your reservation status

          </span>


          <p>
            Redirecting to payment...
          </p>

        </div>

      `;


      // Save code for copy button

      window.currentBookingCode =
        reservation.reservation_code;


      // =========================
      // REDIRECT TO PAYMENT
      // =========================

      setTimeout(() => {

        window.location.href =
          "payment.html?reservation=" +
          encodeURIComponent(
            reservation.reservation_code
          );

      }, 2500);

    }


    // =========================
    // COPY BOOKING CODE
    // =========================

    function copyBookingCode() {

      if (
        !window.currentBookingCode
      ) {
        return;
      }


      navigator.clipboard
        .writeText(
          window.currentBookingCode
        )
        .then(() => {

          const button =
            document.querySelector(
              ".copy-code"
            );


          if (!button) {
            return;
          }


          button.textContent =
            "✅ Copied!";


          setTimeout(() => {

            button.textContent =
              "📋 Copy";

          }, 1500);

        })
        .catch(() => {

          alert(
            "Could not copy automatically. Please copy the code manually."
          );

        });

    }


    // =========================
    // DATE EVENTS
    // =========================

    document
      .getElementById(
        "checkIn"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    document
      .getElementById(
        "checkOut"
      )
      .addEventListener(
        "change",
        calculateTotal
      );


    // =========================
    // START
    // =========================

    loadRoom();

  </script>

</body>

</html>
