<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cancel Reservation</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f7f5f0;margin:0;padding:20px;color:#222}
.container{max-width:500px;margin:30px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{text-align:center;margin-bottom:20px}
.warning{background:#fff0f0;border:2px solid #c62828;color:#b71c1c;padding:18px;border-radius:12px;margin-bottom:20px}
.warning h3{margin:0 0 10px}
.booking{background:#fffdf5;border:2px solid #d4af37;border-radius:12px;padding:15px;text-align:center;margin-bottom:20px}
.code{font-size:23px;font-weight:bold;letter-spacing:2px}
.info{padding:12px 0;border-bottom:1px solid #eee}
.label{font-weight:bold}
.refund{background:#f3fff5;border:1px solid #55b875;padding:15px;border-radius:10px;margin-top:15px}
.refund strong{color:#16833b}
label{display:block;font-weight:bold;margin-top:20px;margin-bottom:7px}
textarea{width:100%;min-height:100px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;resize:vertical}
.cancel{width:100%;padding:14px;margin-top:20px;background:#c62828;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.cancel:disabled{opacity:.6;cursor:not-allowed}
.home{display:block;text-align:center;margin-top:12px;padding:12px;background:#111;color:white;text-decoration:none;border-radius:8px;font-weight:bold}
#message{text-align:center;margin-top:18px;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>❌ Cancel Reservation</h1>

<div class="warning">
<h3>🔴 Cancellation Notice</h3>
<p>Cancellation of this reservation will result in a <strong>75% refund</strong> of the confirmed payment amount.</p>
<p>The remaining <strong>25%</strong> will be retained as the cancellation fee.</p>
</div>

<div class="booking">
<div style="font-size:13px;color:#777;margin-bottom:7px">Reservation ID</div>
<div id="reservationCode" class="code">Loading...</div>
</div>

<div id="details">
Loading reservation details...
</div>

<label for="reason">Reason for cancellation</label>
<textarea id="reason" placeholder="Tell us why you want to cancel..."></textarea>

<button id="cancelButton" class="cancel" onclick="requestCancellation()" disabled>
❌ Request Cancellation
</button>

<div id="message"></div>

<a href="index.html" class="home">🏠 Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(window.location.search);
const reservationCode=params.get("reservation");
let reservation=null;
let payment=null;

async function loadCancellationData(){
const codeElement=document.getElementById("reservationCode");
const details=document.getElementById("details");
const button=document.getElementById("cancelButton");
const message=document.getElementById("message");

if(!reservationCode){
codeElement.textContent="Missing ID";
details.innerHTML="";
message.textContent="❌ No reservation was provided.";
return;
}

codeElement.textContent=reservationCode;

const reservationResult=await supabaseClient
.from("reservations")
.select("*")
.eq("reservation_code",reservationCode)
.single();

if(reservationResult.error||!reservationResult.data){
console.error(reservationResult.error);
details.innerHTML="";
message.textContent="❌ Reservation not found.";
return;
}

reservation=reservationResult.data;

const paymentResult=await supabaseClient
.from("payments")
.select("*")
.eq("reservation_id",reservation.id)
.order("created_at",{ascending:false})
.limit(1)
.maybeSingle();

if(paymentResult.error){
console.error(paymentResult.error);
details.innerHTML="";
message.textContent="❌ Could not load payment information.";
return;
}

payment=paymentResult.data;

if(!payment){
details.innerHTML="";
message.textContent="❌ No payment was found for this reservation.";
return;
}

const amount=Number(payment.amount)||0;
const refund=amount*0.75;
const fee=amount*0.25;

details.innerHTML=`
<div class="info">
<span class="label">Payment amount:</span>
${amount.toFixed(2)} ETB
</div>
<div class="refund">
<div class="info">
<span class="label">Expected refund (75%):</span>
<strong>${refund.toFixed(2)} ETB</strong>
</div>
<div class="info">
<span class="label">Cancellation fee (25%):</span>
${fee.toFixed(2)} ETB
</div>
<p style="font-size:13px;color:#666;margin-bottom:0">
The refund amount is calculated automatically from your payment.
</p>
</div>
`;

if(reservation.status==="cancelled"){
message.textContent="⚠️ This reservation has already been cancelled.";
return;
}

if(payment.status!=="confirmed"){
message.textContent="⚠️ Cancellation is available after the payment has been confirmed.";
return;
}

button.disabled=false;
}

async function requestCancellation(){
const reason=document.getElementById("reason").value.trim();
const button=document.getElementById("cancelButton");
const message=document.getElementById("message");

if(!reservation||!payment)return;

if(!reason){
message.textContent="❌ Please enter a reason for cancellation.";
return;
}

button.disabled=true;
button.textContent="Submitting...";
message.textContent="";

const refundAmount=(Number(payment.amount)||0)*0.75;

const result=await supabaseClient
.from("cancellations")
.insert({
reservation_id:reservation.id,
reason:reason,
refund_amount:refundAmount,
status:"pending"
});

if(result.error){
console.error(result.error);
message.textContent="❌ Could not submit cancellation request.";
button.disabled=false;
button.textContent="❌ Request Cancellation";
return;
}

message.innerHTML=`
<span style="color:#16833b;font-size:18px">
✅ Cancellation request submitted!
</span>
<p style="font-size:14px;color:#666;font-weight:normal">
The hotel will review your cancellation request.
Your expected refund is ${refundAmount.toFixed(2)} ETB.
</p>
`;

document.getElementById("reason").disabled=true;
button.style.display="none";
}

loadCancellationData();
</script>

</body>
</html>
